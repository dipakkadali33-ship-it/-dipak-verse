<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DipakVerse</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, black, #1a1a2e);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 24px;
      color: cyan;
    }

    .hero {
      margin-top: 80px;
    }

    .hero h1 {
      font-size: 40px;
    }

    .section {
      margin-top: 60px;
    }

    .gallery img {
      width: 200px;
      margin: 10px;
      border-radius: 10px;
    }

    video {
      margin-top: 20px;
      border-radius: 10px;
    }

    footer {
      margin-top: 80px;
      padding: 20px;
      font-size: 14px;
      color: #aaa;
    }

    button {
      padding: 10px 20px;
      background: cyan;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>🌌 DipakVerse</header>

<div class="hero">
  <h1>Welcome to DipakVerse</h1>
  <p>My world of photos & videos 🔥</p>
  <button onclick="showMsg()">Explore</button>
</div>

<div class="section">
  <h2>📸 Photo Gallery</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
  </div>
</div>

<div class="section">
  <h2>🎥 Video</h2>
  <video width="300" controls>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<footer>
  © 2026 DipakVerse | Created by You 🚀
</footer>

<script>
function showMsg(){
  alert("Welcome to DipakVerse 🔥");
}
</script>

</body>
</html>
