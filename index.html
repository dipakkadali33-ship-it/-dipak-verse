<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DipakVerse</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #000000, #1a1a2e);
      color: white;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 20px 40px;
      background: rgba(0,0,0,0.7);
    }
    header h1 { color: #00f7ff; }
    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-size: 14px;
    }
    .hero {
      height: 90vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .hero h2 { font-size: 40px; }
    .btn {
      padding: 12px 25px;
      background: #00f7ff;
      border: none;
      border-radius: 8px;
      margin-top: 20px;
      cursor: pointer;
    }
    .section {
      padding: 60px 20px;
      text-align: center;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }
    .gallery img {
      width: 100%;
      border-radius: 10px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: black;
      color: #aaa;
    }
  </style>
</head>
<body><header>
  <h1>🌌 DipakVerse</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#videos">Videos</a>
  </nav>
</header><section class="hero" id="home">
  <h2>Welcome to DipakVerse</h2>
  <p>My world of photos & videos 🔥</p>
  <button class="btn" onclick="msg()">Explore</button>
</section><section class="section" id="gallery">
  <h2>📸 Photo Gallery</h2>
  <div class="gallery">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
  </div>
</section><section class="section" id="videos">
  <h2>🎥 Videos</h2>
  <video width="300" controls>
    <source src="video.mp4" type="video/mp4">
  </video>
</section><footer>
  © 2026 DipakVerse | Created by You 🚀
</footer><script>
function msg(){
  alert("Welcome to DipakVerse 🔥");
}
</script></body>
</html>
